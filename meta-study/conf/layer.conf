# 이 폴더를 레이어로 등록하기 위한 설정 (bitbake-layers create-layer 가 만들어 주는 형태와 동일)
BBPATH .= ":${LAYERDIR}"

# 이 레이어 안의 레시피(.bb)와 bbappend 위치
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-study"
BBFILE_PATTERN_meta-study = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-study = "6"

LAYERDEPENDS_meta-study = "core"
# 이 레이어가 호환되는 Yocto 버전. 다른 버전을 쓰면 여기를 바꿔야 함
LAYERSERIES_COMPAT_meta-study = "scarthgap"
